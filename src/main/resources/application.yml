# AutoSys proxy defaults. Do not put real hostnames here: override any property in
# ./user.properties (in the working directory, git-ignored); see user.properties.example.
# Values marked CHANGE-ME come from observing the AutoSys login exchange.
server:
  port: 8080
  # Behind a TLS-terminating load balancer use: native or framework
  forward-headers-strategy: none

spring:
  application:
    name: autosys-proxy
  config:
    # Settings in this file take precedence over the defaults below.
    # Another file can be chosen with --aproxy.user-properties=/path/to/file.properties
    import: optional:file:${aproxy.user-properties:./user.properties}
  threads:
    virtual:
      enabled: true
  # Spring Cloud Gateway sends no X-Forwarded-*/Forwarded headers to AutoSys unless
  # spring.cloud.gateway.server.webmvc.trusted-proxies is set.

autosys:
  base-url: https://autosys-webui.example.internal:8443   # origin only (no path)
  environment: DEV
  allowed-environments: [DEV, UAT]
  proxy:
    prefix: ""                # "" = AutoSys UI at the proxy root (recommended); e.g. /autosys
    rewrite-body-urls: false  # replace absolute AutoSys URLs in HTML/JS bodies
    preserve-host: true       # send the browser's Host to AutoSys (required by OWASP CSRFGuard)
    access-log: true          # one log line per request (ACCESS logger)
    start-page:               # e.g. /ui/Login.html: where http://proxy/ sends the browser; empty = forward "/"
  session:
    idle-ttl: 8h
    absolute-ttl: 24h
    token-page-ttl: 5m
    browser-use-counts: true      # the browser using AutoSys through the proxy keeps the token from going idle
  http:
    connect-timeout: 5s
    read-timeout: 30s
    max-connections: 50
    # truststore: file:/path/to/truststore.p12
    # truststore-password: ${TRUSTSTORE_PASSWORD}
  token:
    bind-client-ip: false
  webui:
    login:
      path: /CHANGE-ME/login        # AutoSys-relative path of the login form submit (Ant pattern)
      method: POST
      username-field: CHANGE-ME     # form field / JSON property (dotted path allowed)
      password-field: CHANGE-ME
      success:                      # all configured rules must hold
        statuses: []                # e.g. [302]
        location-pattern:           # regex the redirect target must contain
        location-reject-pattern:    # regex meaning "back to login with error"
        cookie:                     # cookie AutoSys sets on success, e.g. JSESSIONID
      failure-marker:               # text in the response body on a bad password
      discovery-log: false          # log the shape (never values) of POSTs to fill in this section
      redirect-to-token-page: true
      landing-page:                 # e.g. /ui/Home.html: page after login; first visit shows /proxy/token
    # WCC Quick View, driven by the proxy itself (own AutoSys login per session) to answer /api/v1/jobs
    quickview:
      page-path: /wcc/quickview/pages/main.jsf
      reuse-browser-page: true      # API searches go through the Quick View page the browser has open
      entry-path: /wcc/quickview/index.jsp   # redirects to main.jsf with the CSRF tokens
      login-page:                   # optional page fetched before the proxy's own login
      form: jobDetailsForm
      search-field: jobNameInput
      search-button: goButtonID
      search-event: autosub
      reuse-browser-session: true   # use the browser's AutoSys session (its cookies); own login only as fallback
      exclude-browser-cookies: [JSESSIONID]   # not reused: API calls get their own Quick View page state
      max-attempts: 2               # 2 = log in again once when the AutoSys session has expired
      xsrf-param: AntiXSRFToken     # launcher token for index.jsp, taken from the browser's requests
      entry-referer: /wcc/ui/Launcher.html
      box-table: boxJobResultTable  # results tree of a box; expanding its first row lists the box's jobs
      expand-event: show
      # job events: choose one in the dropdown (partial-page event), press Go, confirm in the dialog
      event-select: jobResultTable:eventId
      event-button: jobResultTable:sendEventButton
      event-ids:                    # dropdown values, when the page does not list the options' labels
        FORCE_STARTJOB: "1"
      confirmation-path: /wcc/quickview/pages/dialog/confirmationDialog.jsf
      confirmation-form: confirmationDialog
      confirm-button: sendEvtYes
      dialog-params: [AntiXSRFToken, OWASP-CSRFTOKEN, conversationContext]  # from the page URL if missing
      messages-id: pageMessages

  # POST /api/v1/jobs/{name}/actions (only in allowed-environments: the proxy refuses to start elsewhere)
  actions:
    enabled: true
    rate-limit-per-minute: 30     # per session
    idempotency-ttl: 10m          # results of requests with an Idempotency-Key header are replayed this long
    read-status-after: true       # search the job again after the action to report its status

  # Request a job's status in the background so AutoSys sessions do not time out between API calls
  keep-alive:
    enabled: false
    interval: 3m                  # per session; skipped when the session used AutoSys more recently
    job:                          # job to ask for; empty = the job the session looked up last

  # Record AutoSys UI traffic (secrets masked) to learn its internal endpoints. Development only.
  capture:
    enabled: false
    dir: captures             # one sub-directory per run, one JSON file per request
    max-body-bytes: 1048576
    # exclude-path-pattern: regex of paths not recorded (default: static assets .js .css images fonts)

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
    heapdump:
      access: none
    env:
      access: none
    configprops:
      access: none

logging:
  file:
    name: logs/a-proxy.log    # in addition to the console; rolls at 10MB, keeps 7 days
  level:
    root: INFO
    # DEBUG shows how requests are routed and forwarded (headers are not logged)
    com.testing.aproxy: INFO
