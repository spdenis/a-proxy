[versions]
spring-boot = "4.0.9"
spring-dependency-management = "1.1.7"
spring-cloud = "2025.1.4"
jsoup = "1.22.2"
wiremock = "3.13.2"

[libraries]
spring-cloud-dependencies = { module = "org.springframework.cloud:spring-cloud-dependencies", version.ref = "spring-cloud" }
spring-boot-starter-webmvc = { module = "org.springframework.boot:spring-boot-starter-webmvc" }
spring-boot-starter-security = { module = "org.springframework.boot:spring-boot-starter-security" }
spring-boot-starter-validation = { module = "org.springframework.boot:spring-boot-starter-validation" }
spring-boot-starter-actuator = { module = "org.springframework.boot:spring-boot-starter-actuator" }
spring-boot-configuration-processor = { module = "org.springframework.boot:spring-boot-configuration-processor" }
spring-cloud-gateway-webmvc = { module = "org.springframework.cloud:spring-cloud-starter-gateway-server-webmvc" }
httpclient5 = { module = "org.apache.httpcomponents.client5:httpclient5" }
caffeine = { module = "com.github.ben-manes.caffeine:caffeine" }
jsoup = { module = "org.jsoup:jsoup", version.ref = "jsoup" }
spring-boot-starter-webmvc-test = { module = "org.springframework.boot:spring-boot-starter-webmvc-test" }
spring-boot-starter-security-test = { module = "org.springframework.boot:spring-boot-starter-security-test" }
wiremock = { module = "org.wiremock:wiremock-standalone", version.ref = "wiremock" }

[plugins]
spring-boot = { id = "org.springframework.boot", version.ref = "spring-boot" }
spring-dependency-management = { id = "io.spring.dependency-management", version.ref = "spring-dependency-management" }
